name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # release banane ke liye

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: app.zip kholo
        run: unzip -oq app.zip

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Android project generate karo
        run: npx cap add android

      - name: Icons + version lagao
        run: |
          # Capacitor ka default splash.png hatao, uski jagah apna splash.xml aayega
          find android/app/src/main/res -name 'splash.png' -delete
          cp -r android-res/* android/app/src/main/res/
          sed -i "s/versionCode [0-9]\+/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \".*\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: Web files sync karo
        run: npx cap sync android

      # Har baar same signing key use hoti hai, taaki nayi APK purani app ke upar update ho jaye (data delete kiye bina)
      - name: Signing key lagao
        run: |
          mkdir -p ~/.android
          cp android-signing/debug.keystore ~/.android/debug.keystore

      - name: APK build karo
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: APK ka naam theek karo
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/BucketList.apk
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: BucketList-apk
          path: dist/BucketList.apk

      - name: Release banao (phone se download karne ke liye)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: BucketList v${{ github.run_number }}
          body: |
            Android APK. Download karo, install karo. Pehli baar "Unknown sources / Install unknown apps" allow karna padega.
          files: dist/BucketList.apk
          make_latest: true
          
